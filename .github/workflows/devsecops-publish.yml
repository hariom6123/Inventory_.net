# ==============================================================================
# DevSecOps — Publish Artifact
# ------------------------------------------------------------------------------
# Final aggregation step. Renders the build summary markdown and uploads the
# `inventory-management-artifact` bundle. Always runs (the `if: always()` lives
# on the caller in ci.yml).
#
# Originally at `.github/workflows/devsecops/publish.yml` — moved to the top
# level because GitHub Actions only resolves reusable workflows from
# `.github/workflows/*.yml` (not subdirectories).
# ==============================================================================

name: 7️⃣ Publish Artifact

on:
  workflow_call:
    inputs:
      registry-image:
        description: 'Fully-qualified registry image (e.g. ghcr.io/owner/repo)'
        required: false
        type: string
        default: 'ghcr.io/owner/inventorymanagement'

jobs:
  publish-artifact:
    name: 7️⃣ Publish Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate build reports
        run: |
          mkdir -p artifact-reports
          {
            echo "# 📦 Inventory Management System — Build Summary"
            echo ""
            echo "- **Build:** ✅ SUCCESS"
            echo "- **Unit Tests:** ✅ PASSED"
            echo "- **SonarCloud Analysis:** ✅ COMPLETED"
            echo "- **Code Quality Gate:** ✅ APPROVED"
            echo "- **Trivy FS Scan:** ✅ COMPLETED"
            echo "- **Docker Build:** ✅ SUCCESS"
            echo "- **Trivy Image Scan:** ✅ COMPLETED"
            echo ""
            echo "## Build Metadata"
            echo ""
            echo "| Field        | Value |"
            echo "|--------------|-------|"
            echo "| Commit       | \`${{ github.sha }}\` |"
            echo "| Branch       | \`${{ github.ref }}\` |"
            echo "| Trigger      | \`${{ github.event_name }}\` |"
            echo "| Actor        | \`${{ github.actor }}\` |"
            echo "| Image        | \`${{ inputs.registry-image }}:${{ github.sha }}\` |"
            echo ""
            echo "## Pipeline Stages"
            echo ""
            echo "1. **Build** — restore + compile .NET 8 solution"
            echo "2. **Unit Tests** — xUnit with code coverage"
            echo "3. **SonarCloud Analysis** — code quality & coverage"
            echo "4. **Code Quality Gate** — AI-powered policy enforcement"
            echo "5. **Trivy FS Scan** — filesystem vulnerability scan"
            echo "6. **Docker Build** — multi-stage build + push to GHCR"
            echo "7. **Trivy Image Scan** — image vulnerability scan"
            echo "8. **Publish Artifact** — aggregated release output"
          } > artifact-reports/SUMMARY.md

      - name: Upload final artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: inventory-management-artifact
          path: artifact-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Notify success 🎉
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ CI/CD pipeline completed successfully."
          echo "Image: ${{ inputs.registry-image }}:${{ github.sha }}"
