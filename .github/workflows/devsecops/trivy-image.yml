# ==============================================================================
# DevSecOps — Trivy Image Scan
# ------------------------------------------------------------------------------
# Pulls the image produced by `docker-build` from GHCR and scans it with
# Trivy in both table and SARIF formats. Skipped on pull_request events
# (the image is local-only on PRs and the push is no-op). The orchestrator
# must pass `image_tag` from the docker-build outputs.
# ==============================================================================

name: 6️⃣ Trivy Image Scan

on:
  workflow_call:
    inputs:
      registry-image:
        description: 'Fully-qualified registry image (e.g. ghcr.io/owner/repo)'
        required: true
        type: string
      image-tag:
        description: 'Tag emitted by the docker-build workflow'
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  trivy-image-scan:
    name: 6️⃣ Trivy Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image (with retries) before scanning
        if: github.event_name != 'pull_request' && inputs.image-tag != ''
        run: |
          IMAGE_REF="${{ inputs.registry-image }}:${IMAGE_TAG}"
          echo "Attempting to pull $IMAGE_REF"
          for i in 1 2 3; do
            if docker pull "$IMAGE_REF"; then
              echo "Pulled $IMAGE_REF"
              exit 0
            else
              echo "Pull failed (attempt $i/3), retrying..."
              sleep $((i*3))
            fi
          done
          echo "Failed to pull $IMAGE_REF after retries; continuing may fail."
          exit 1
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}

      - name: Run Trivy image scan (table)
        if: github.event_name != 'pull_request' && inputs.image-tag != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.registry-image }}:${{ inputs.image-tag }}
          format: 'table'
          output: 'trivy-image-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
        continue-on-error: true

      - name: Run Trivy image scan (SARIF)
        if: github.event_name != 'pull_request' && inputs.image-tag != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.registry-image }}:${{ inputs.image-tag }}
          format: 'sarif'
          output: 'trivy-image-report.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy image results to GitHub Security tab
        if: github.event_name != 'pull_request' && always() && inputs.image-tag != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-report.sarif
        continue-on-error: true

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
          if-no-files-found: warn
          retention-days: 7
