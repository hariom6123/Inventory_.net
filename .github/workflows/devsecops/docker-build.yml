# ==============================================================================
# DevSecOps — Docker Build
# ------------------------------------------------------------------------------
# Multi-stage Docker build + push to GHCR. On pull_request events the image
# is built and tagged locally (no push) so the downstream image scan can
# operate on a tagged artifact. Emits the multi-tag metadata string the
# `trivy-image` workflow consumes.
# ==============================================================================

name: 5️⃣ Docker Build

on:
  workflow_call:
    inputs:
      registry-image:
        description: 'Fully-qualified registry image (e.g. ghcr.io/owner/repo)'
        required: true
        type: string
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      local-image-name:
        description: 'Local image tag used on pull_request events'
        required: false
        type: string
        default: 'inventorymanagement'
    outputs:
      image_tag:
        description: 'Tag string produced by docker/metadata-action'
        value: ${{ jobs.docker-build.outputs.image_tag }}
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  docker-build:
    name: 5️⃣ Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry-image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Tag local image for image scan
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --tag ${{ inputs.local-image-name }}:latest \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .
