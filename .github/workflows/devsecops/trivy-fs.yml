# ==============================================================================
# DevSecOps — Trivy Filesystem Scan
# ------------------------------------------------------------------------------
# Runs aquasecurity/trivy-action against the working tree in both table and
# SARIF formats. SARIF results are uploaded to the GitHub Security tab on
# non-PR events. The dependency vulnerability analyst AI agent is defined
# separately in `ai/dependency-agent.yml`; this workflow only emits the raw
# NuGet vulnerability report it consumes.
# ==============================================================================

name: 4️⃣ Trivy FS Scan

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version'
        required: false
        type: string
        default: '8.0.x'
      solution:
        description: 'Solution file path'
        required: false
        type: string
        default: 'InventoryManagementSystem.sln'

jobs:
  trivy-fs-scan:
    name: 4️⃣ Trivy FS Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Setup .NET ${{ inputs.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Generate NuGet vulnerability report
        run: |
          echo "Scanning NuGet packages for known vulnerabilities..."
          dotnet restore ${{ inputs.solution }}
          dotnet list ${{ inputs.solution }} package --vulnerable --include-transitive > nuget-report.txt 2>&1 || true
          echo "NuGet report generated. Size: $(wc -c < nuget-report.txt) bytes"

      - name: Upload NuGet vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-report
          path: nuget-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Run Trivy filesystem scan (SARIF)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-report.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        if: github.event_name != 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-report.sarif
        continue-on-error: true

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt
          if-no-files-found: warn
          retention-days: 7
