# ==============================================================================
# Inventory Management System — CI/CD Pipeline
# ==============================================================================
# Stages:
#   1. Build              — restore + compile the .NET 8 solution
#   2. Unit Tests         — run xUnit suite with code coverage
#   3. SonarCloud Scan    — code quality analysis
#   4. Trivy FS Scan      — static filesystem vulnerability scan
#   5. Docker Build       — multi-stage Docker image build + push to GHCR
#   6. Trivy Image Scan   — vulnerability scan of the built image
#   7. Publish Artifact   — final aggregated release artifact
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feature/**, prismascan ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, feature/** ]
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to GHCR on workflow_dispatch'
        required: false
        default: 'true'
        type: boolean

# ------------------------------------------------------------------------------
# Concurrency — cancel in-flight runs on the same branch
# ------------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: InventoryManagementSystem.sln
  PROJECT: src/InventoryManagement.Web/InventoryManagement.Web.csproj
  IMAGE_NAME: inventorymanagement
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/inventorymanagement
  SONAR_PROJECT_KEY: hariom6123_Inventory_.net
  SONAR_ORGANIZATION: hariom6123

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: write

# ==============================================================================
# Jobs
# ==============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # 1. Build — restore + compile the solution
  # ---------------------------------------------------------------------------
  build:
    name: 1️⃣ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Publish web project
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --no-build
          --output publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: publish/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Unit Tests — run xUnit suite with coverage
  # ---------------------------------------------------------------------------
  unit-tests:
    name: 2️⃣ Unit Tests
    runs-on: ubuntu-latest
    needs: [ build ]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Run tests with coverage
        run: |
          dotnet test ${{ env.SOLUTION }} \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn
          retention-days: 7

      - name: Publish code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. SonarCloud Code Quality Analysis
  # ---------------------------------------------------------------------------
  sonarqube:
    name: 3️⃣ SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Begin SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build
        run: |
          dotnet build ${{ env.SOLUTION }} \
            --configuration Release \
            --no-restore

      - name: Test
        run: |
          dotnet test ${{ env.SOLUTION }} \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "trx"

      - name: End SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="${SONAR_TOKEN}"

  # ---------------------------------------------------------------------------
  # 4. AI Code Quality Security Gate
  # ---------------------------------------------------------------------------
  code-quality-agent:
    name: 🤖 Agent 1 - Code Quality Security Gate
    runs-on: ubuntu-latest
    needs: [ sonarqube ]
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: reports
        continue-on-error: true

      - name: Download Code Coverage
        uses: actions/download-artifact@v4
        with:
          name: code-coverage
          path: reports
        continue-on-error: true

      - name: Fetch SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ env.SONAR_PROJECT_KEY }}" \
            > sonar-quality.json

      - name: Prepare Reports
        run: |
          cat sonar-quality.json > sonar-report.txt
          find reports -name "*.trx" -exec cat {} \; > unit-test-report.txt 2>/dev/null || true
          find reports -name "*.xml" -exec cat {} \; > coverage-report.txt 2>/dev/null || true

      - name: 🤖 Agent 1 - Code Quality Security Gate
        env:
          NVDAI_API_KEY: ${{ secrets.nvdai_api_key }}
        run: |
          echo "🤖 Running Agent 1: Code Quality Security Gate..."

          # Truncate large files to avoid jq argument list too long error
          truncate -s 10240 sonar-report.txt 2>/dev/null || true
          truncate -s 10240 coverage-report.txt 2>/dev/null || true
          truncate -s 10240 unit-test-report.txt 2>/dev/null || true

          # Create payload file to avoid command line length issues
          cat > payload.json <<'PAYLOAD_EOF'
          {
            "model": "meta/llama-3.1-70b-instruct",
            "max_tokens": 1800,
            "messages": [
              {
                "role": "user",
                "content": "You are an Enterprise DevSecOps Code Quality Security Gate Agent.\n\nYour responsibility is to determine whether the application satisfies the organization's code quality standards before security scanning begins.\n\nAnalyze the following reports:\n\nBuild Status: PASS\n\nEnterprise Quality Policy:\n• Build must succeed.\n• Unit tests must pass.\n• Code coverage must be at least 80%.\n• SonarCloud Quality Gate must PASS.\n• New Bugs must be ZERO.\n• New Vulnerabilities must be ZERO.\n• Security Rating must be A.\n• Reliability Rating must be A.\n• Maintainability Rating must be A.\n\nReturn ONLY Markdown using this exact format:\n\n# Enterprise Code Quality Gate Report\n\n## Build Status\nPASS or FAIL\n\n## Unit Test Status\nPASS or FAIL\n\n## Code Coverage\nCoverage:\nRequired:\nStatus:\n\n## SonarCloud Summary\nQuality Gate:\nSecurity Rating:\nReliability Rating:\nMaintainability Rating:\n\n## Overall Decision\nAPPROVED, APPROVED WITH WARNINGS, or BLOCKED\n\n## Summary\n[brief explanation]"
              }
            ]
          }
          PAYLOAD_EOF

          RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $NVDAI_API_KEY" \
            -d @payload.json)

          echo "────────────────────────────────────────────"
          echo "🤖 Agent 1 - Code Quality Security Gate"
          echo "────────────────────────────────────────────"

          echo "$RESPONSE" | jq -r '.choices[0].message.content // "Agent response unavailable"' 2>/dev/null || echo "$RESPONSE"

          echo "────────────────────────────────────────────"

          echo "$RESPONSE" | jq -r '.choices[0].message.content // ""' 2>/dev/null > code-quality-gate-report.md || echo "Agent response processing failed" > code-quality-gate-report.md

      - name: Upload Code Quality Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-gate-report
          path: code-quality-gate-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Code Quality Gate
        run: |
          echo "Checking AI decision..."

          if grep -q "BLOCKED" code-quality-gate-report.md; then
            echo "❌ AI Code Quality Gate blocked the pipeline."
            exit 1
          fi

          if grep -q "APPROVED WITH WARNINGS" code-quality-gate-report.md; then
            echo "⚠ AI approved the build with warnings."
            exit 0
          fi

          echo "✅ AI Code Quality Gate passed."

  # ---------------------------------------------------------------------------
  # 5. Trivy Filesystem Scan
  # ---------------------------------------------------------------------------
  trivy-fs-scan:
    name: 5️⃣ Trivy FS Scan
    runs-on: ubuntu-latest
    needs: [ code-quality-agent ]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate NuGet vulnerability report
        run: |
          echo "Scanning NuGet packages for known vulnerabilities..."
          dotnet restore ${{ env.SOLUTION }}
          dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive > nuget-report.txt 2>&1 || true
          echo "NuGet report generated. Size: $(wc -c < nuget-report.txt) bytes"

      - name: Agent 2 - Dependency Vulnerability Analyst
        env:
          NVDAI_API_KEY: ${{ secrets.nvdai_api_key }}
        run: |
          echo "🤖 Running Agent 2: Dependency Vulnerability Analyst..."

          # Truncate report to avoid jq argument list too long error
          truncate -s 10240 nuget-report.txt 2>/dev/null || true

          # Create payload file instead of inline variable
          cat > payload.json <<'PAYLOAD_EOF'
          {
            "model": "meta/llama-3.1-70b-instruct",
            "max_tokens": 1024,
            "messages": [{
              "role": "user",
              "content": "You are a .NET security expert. Analyze this NuGet dependency report for the Inventory Management System project and:\n1. List any outdated or vulnerable packages, categorized by severity (CRITICAL, HIGH, MEDIUM).\n2. Provide remediation guidance for critical packages.\n3. Recommend a dependency update strategy.\n4. Return findings as Markdown with clear sections.\n\nNuGet Report: [Report available via file analysis]"
            }]
          }
          PAYLOAD_EOF

          RESPONSE=$(curl -s https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $NVDAI_API_KEY" \
            -d @payload.json)

          echo "──────────────────────────────────────────"
          echo "🤖 Agent 2 - Dependency Vulnerability Analysis"
          echo "──────────────────────────────────────────"
          echo "$RESPONSE" | jq -r '.choices[0].message.content // "Agent response unavailable"' 2>/dev/null || echo "$RESPONSE"
          echo "──────────────────────────────────────────"

          echo "$RESPONSE" | jq -r '.choices[0].message.content // ""' 2>/dev/null > agent2-report.txt || echo "Agent response processing failed" > agent2-report.txt

      - name: Upload Agent 2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent2-dependency-report
          path: agent2-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Run Trivy filesystem scan (SARIF)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-report.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        if: github.event_name != 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-report.sarif
        continue-on-error: true

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 6. Docker Build
  # ---------------------------------------------------------------------------
  docker-build:
    name: 6️⃣ Docker Build
    runs-on: ubuntu-latest
    needs: [ trivy-fs-scan ]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: publish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Tag local image for image scan
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

  # ---------------------------------------------------------------------------
  # 7. Prisma Cloud Image Scan
  # ---------------------------------------------------------------------------
  prisma-cloud-scan:
    name: 7️⃣ Prisma Cloud Image Scan
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download twistcli
        run: |
          curl -k \
            -u "${{ secrets.PRISMA_ACCESS_KEY }}:${{ secrets.PRISMA_SECRET_KEY }}" \
            "${{ secrets.PRISMA_CONSOLE_URL }}/api/v1/util/twistcli" \
            --output twistcli

          chmod +x twistcli

      - name: Scan Docker Image
        run: |
          ./twistcli images scan \
            --address "${{ secrets.PRISMA_CONSOLE_URL }}" \
            --user "${{ secrets.PRISMA_ACCESS_KEY }}" \
            --password "${{ secrets.PRISMA_SECRET_KEY }}" \
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 8. Trivy Image Scan (updated)
  # ---------------------------------------------------------------------------
  trivy-image-scan:
    name: 8️⃣ Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pushed image tag from docker-build metadata
        id: resolve-image
        run: |
          echo "docker-build produced tags: '${{ needs.docker-build.outputs.image_tag }}'"
          TAGS="${{ needs.docker-build.outputs.image_tag }}"

          # Normalize separators (commas/newlines) and drop empty lines
          printf "%s\n" "$TAGS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > /tmp/tags.txt

          # Prefer tag that contains full commit SHA, then tag starting with 'sha-', else first tag
          SELECTED="$(grep -m1 "${{ github.sha }}" /tmp/tags.txt || grep -m1 '^sha-' /tmp/tags.txt || head -n1 /tmp/tags.txt || true)"

          if [ -z "$SELECTED" ]; then
            echo "No tag found from docker-build metadata; marking IMAGE_TAG empty."
            echo "IMAGE_TAG=" >> $GITHUB_ENV
            exit 0
          fi

          # If metadata entry is full ref (owner/repo:tag), extract the tag portion
          if echo "$SELECTED" | grep -q ':'; then
            SELECTED="${SELECTED##*:}"
          fi

          echo "Selected image tag: $SELECTED"
          echo "IMAGE_TAG=$SELECTED" >> $GITHUB_ENV

      - name: Pull image (with retries) before scanning
        if: github.event_name != 'pull_request' && env.IMAGE_TAG != ''
        run: |
          IMAGE_REF="${{ env.REGISTRY_IMAGE }}:${IMAGE_TAG}"
          echo "Attempting to pull $IMAGE_REF"
          for i in 1 2 3; do
            if docker pull "$IMAGE_REF"; then
              echo "Pulled $IMAGE_REF"
              exit 0
            else
              echo "Pull failed (attempt $i/3), retrying..."
              sleep $((i*3))
            fi
          done
          echo "Failed to pull $IMAGE_REF after retries; continuing may fail."
          exit 1

      - name: Run Trivy image scan (table)
        if: github.event_name != 'pull_request' && env.IMAGE_TAG != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}
          format: 'table'
          output: 'trivy-image-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
        continue-on-error: true

      - name: Run Trivy image scan (SARIF)
        if: github.event_name != 'pull_request' && env.IMAGE_TAG != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-image-report.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy image results to GitHub Security tab
        if: github.event_name != 'pull_request' && always() && env.IMAGE_TAG != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-report.sarif
        continue-on-error: true

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
          if-no-files-found: warn
          retention-days: 7

   # ---------------------------------------------------------------------------
   # 9. Deploy to AWS EC2
   # ---------------------------------------------------------------------------
   deploy:
     name: 9️⃣ Deploy to AWS EC2
     runs-on: ubuntu-latest
     needs: [ trivy-image-scan ]
     timeout-minutes: 10

     environment:
       name: production

     steps:
       - name: 🚀 Deploy Docker Image to EC2
         uses: appleboy/ssh-action@v1.2.2
         with:
           host: ${{ secrets.EC2_HOST }}
           username: ${{ secrets.EC2_USERNAME }}
           key: ${{ secrets.EC2_SSH_KEY }}

           script: |
             set -e

             IMAGE="ghcr.io/${{ github.repository_owner }}/inventorymanagement:sha-${{ github.sha }}"
             CONTAINER="inventory-app"

             echo "========================================="
             echo "🚀 Enterprise Deployment Started"
             echo "========================================="

             echo "Deploying Image:"
             echo "$IMAGE"

             echo "-----------------------------------------"
             echo "Stopping existing container..."
             docker stop $CONTAINER || true

             echo "Removing existing container..."
             docker rm $CONTAINER || true

             echo "-----------------------------------------"
             echo "Pulling latest verified image..."
             docker pull $IMAGE

             echo "-----------------------------------------"
             echo "Starting container..."

             docker run -d \
               --name $CONTAINER \
               --restart unless-stopped \
               -p 80:80 \
               $IMAGE

             echo "-----------------------------------------"
             echo "Waiting for application startup..."
             sleep 20

             echo "Running health check..."

             curl -f http://localhost || exit 1

             echo "-----------------------------------------"
             echo "Running container:"
             docker ps

             echo "========================================="
             echo "✅ Deployment Successful"
             echo "========================================="
   
  # ---------------------------------------------------------------------------
  # 10. Publish Artifact — final aggregated artifact step
  # ---------------------------------------------------------------------------
  publish-artifact:
    name:  Publish Artifact
    runs-on: ubuntu-latest
    needs: [ trivy-image-scan, prisma-cloud-scan ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Aggregate build reports
        run: |
          mkdir -p artifact-reports
          {
            echo "# 📦 Inventory Management System — Build Summary"
            echo ""
            echo "- **Build:** ✅ SUCCESS"
            echo "- **Unit Tests:** ✅ PASSED"
            echo "- **SonarCloud Analysis:** ✅ COMPLETED"
            echo "- **Code Quality Gate:** ✅ APPROVED"
            echo "- **Trivy FS Scan:** ✅ COMPLETED"
            echo "- **Docker Build:** ✅ SUCCESS"
            echo "- **Prisma Cloud Scan:** ✅ COMPLETED"
            echo "- **Trivy Image Scan:** ✅ COMPLETED"
            echo ""
            echo "## Build Metadata"
            echo ""
            echo "| Field        | Value |"
            echo "|--------------|-------|"
            echo "| Commit       | \`${{ github.sha }}\` |"
            echo "| Branch       | \`${{ github.ref }}\` |"
            echo "| Trigger      | \`${{ github.event_name }}\` |"
            echo "| Actor        | \`${{ github.actor }}\` |"
            echo "| Image        | \`${{ env.REGISTRY_IMAGE }}:${{ github.sha }}\` |"
            echo ""
            echo "## Pipeline Stages"
            echo ""
            echo "1. **Build** — restore + compile .NET 8 solution"
            echo "2. **Unit Tests** — xUnit with code coverage"
            echo "3. **SonarCloud Analysis** — code quality & coverage"
            echo "4. **Code Quality Gate** — AI-powered policy enforcement"
            echo "5. **Trivy FS Scan** — filesystem vulnerability scan"
            echo "6. **Docker Build** — multi-stage build + push to GHCR"
            echo "7. **Prisma Cloud Scan** — container security scan"
            echo "8. **Trivy Image Scan** — image vulnerability scan"
            echo "9. **Publish Artifact** — aggregated release output"
          } > artifact-reports/SUMMARY.md

      - name: Upload final artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: inventory-management-artifact
          path: artifact-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Notify success 🎉
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ CI/CD pipeline completed successfully."
          echo "Image: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}"
